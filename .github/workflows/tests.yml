name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib, mysqli, openssl, tokenizer
          coverage: none
      - name: Lint
        run: |
          for f in $(find . -name '*.php' -not -path './.git/*') installer/installer.php.tpl; do php -l "$f" > /dev/null || exit 1; done
      - name: Unit tests
        run: php tests/run-tests.php

  # Un vrai WordPress : sauvegarde, installation par l'installeur, puis les outils.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wp: '5.9'
          - php: '8.1'
            wp: '6.4'
          - php: '8.3'
            wp: 'latest'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib, mysqli, openssl, gd, mbstring, curl, tokenizer
          ini-values: memory_limit=512M
          tools: wp-cli
          coverage: none
      - name: MySQL
        run: sudo systemctl start mysql.service
      - name: Émulateur S3 (moto)
        run: pip install "moto[server]==5.0.28" boto3
      - name: Test de bout en bout (WordPress ${{ matrix.wp }})
        env:
          WP_VERSION: ${{ matrix.wp }}
          DB_USER: root
          DB_PASS: root
        run: bash tests/e2e/run.sh
