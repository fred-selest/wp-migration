name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib, mysqli, openssl, tokenizer
          coverage: none
      - name: Lint
        run: |
          for f in $(find . -name '*.php' -not -path './.git/*') installer/installer.php.tpl; do php -l "$f" > /dev/null || exit 1; done
      - name: Unit tests
        run: php tests/run-tests.php
